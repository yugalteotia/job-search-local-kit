            - generic [ref=e137]:
              - paragraph [ref=e138]:
                - generic [ref=e139]:
                  - text: Optum is a global organization that delivers care, aided by technology to help millions of people live healthier lives. The work you do with our team will directly improve health outcomes by connecting people with the care, pharmacy benefits, data and resources they need to feel their best. Here, you will find a culture guided by inclusion, talented peers, comprehensive benefits and career development opportunities. Come make an impact on the communities we serve as you help us advance health optimization on a global scale. Join us to start
                  - strong [ref=e140]: Caring. Connecting. Growing together.
              - paragraph [ref=e141]:
                - strong [ref=e143]: Role Summary
              - paragraph [ref=e144]: The Software Engineer - Grade 26 contributes to the design, development, testing, deployment, monitoring, and maintenance of software solutions that support business and customer outcomes. This role applies coding skills to defined capabilities with limited guidance, builds an understanding of system architecture and upstream/downstream dependencies, and supports quality, reliability, security, and maintainability in every deliverable.
              - paragraph [ref=e145]:
                - strong [ref=e147]: "Primary Responsibilities:"
              - list [ref=e148]:
                - listitem [ref=e149]: Design, develop, debug, test, deploy, and maintain assigned software capabilities, features, APIs, services, scripts, or application components
                - listitem [ref=e150]: Write clean, secure, reusable, and maintainable code that aligns with team standards, engineering practices, and quality expectations
                - listitem [ref=e151]: Apply an automation-first mindset by improving repeatable development, testing, deployment, monitoring, and support tasks
                - listitem [ref=e152]: Participate in Agile delivery activities including backlog refinement, estimation, sprint planning, demos, reviews, and retrospectives
                - listitem [ref=e153]: Collaborate with product owners, business partners, quality engineers, architects, and peer engineers to translate requirements into working solutions
                - listitem [ref=e154]: Develop an understanding of application architecture, cost/complexity tradeoffs, and dependencies across upstream and downstream systems
                - listitem [ref=e155]: Instrument delivered features using standard logging, monitoring, alerting, and diagnostic practices so issues can be detected and resolved early
                - listitem [ref=e156]: Support production readiness by contributing to CI/CD pipelines, automated tests, deployment validation, incident analysis, and post-release improvements
                - listitem [ref=e157]: Troubleshoot defects, performance bottlenecks, data issues, and operational problems; recommend corrective actions with guidance from senior engineers
                - listitem [ref=e158]: Continuously learn modern engineering practices, cloud, DevOps, security, AI-enabled development methods, and emerging tools relevant to the team's technology stack
                - listitem [ref=e159]: Comply with the terms and conditions of the employment contract, company policies and procedures, and any and all directives (such as, but not limited to, transfer and/or re-assignment to different work locations, change in teams and/or work shifts, policies in regards to flexibility of work benefits and/or work environment, alternative work arrangements, and other decisions that may arise due to the changing business environment). The Company may adopt, vary or rescind these policies and directives in its absolute discretion and without any limitation (implied or otherwise) on its ability to do so
              - paragraph [ref=e160]:
                - strong [ref=e162]: "Required Qualifications:"
              - list [ref=e163]:
                - listitem [ref=e164]: Bachelor's degree in Computer Science, Software Engineering, Information Technology, Engineering, or equivalent practical experience
                - listitem [ref=e165]: Typically 2+ years of relevant professional software engineering experience, or equivalent demonstrated capability
                - listitem [ref=e166]: Hands-on experience with at least one modern programming language such as Java, Python, C#, JavaScript/TypeScript, React/Angular or similar
                - listitem [ref=e167]: Experience developing or supporting web applications, APIs, backend services, batch jobs, cloud-native services, or enterprise application components
                - listitem [ref=e168]: Working knowledge of software development fundamentals including data structures, algorithms, object-oriented design, debugging, unit testing, and version control
                - listitem [ref=e169]: Awareness of CI/CD practices, automated testing, code quality tools, observability, secure coding, and production support expectations
                - listitem [ref=e170]: Demonstrated ability to analyze problems, learn unfamiliar systems, communicate clearly, and deliver assigned work with quality and accountability
              - paragraph [ref=e171]:
                - strong [ref=e173]: "Preferred Qualifications:"
              - list [ref=e174]:
                - listitem [ref=e175]: Experience with cloud platforms such as Azure, AWS, or GCP
                - listitem [ref=e176]: Experience with monitoring or diagnostics tools such as Splunk, Grafana, Prometheus, Dynatrace, or similar
                - listitem [ref=e177]: Exposure to microservices, REST APIs, event-driven architecture, containers, Kubernetes/OpenShift, or platform engineering concepts
                - listitem [ref=e178]: Working knowledge of relational or NoSQL databases and basic data modeling principles
                - listitem [ref=e179]: Exposure to healthcare, claims, compliance, security, or regulated enterprise environments
                - listitem [ref=e180]: Proven interest in using AI-assisted engineering tools responsibly to improve design, coding, testing, documentation, and delivery productivity
              - paragraph [ref=e181]:
                - generic [ref=e182]: At UnitedHealth Group, our mission is to help people live healthier lives and make the health system work better for everyone. We believe everyone-of every race, gender, sexuality, age, location and income-deserves the opportunity to live their healthiest life. Today, however, there are still far too many barriers to good health which are disproportionately experienced by people of color, historically marginalized groups and those with lower incomes. We are committed to mitigating our impact on the environment and enabling and delivering equitable care that addresses health disparities and improves health outcomes - an enterprise priority reflected in our mission.
