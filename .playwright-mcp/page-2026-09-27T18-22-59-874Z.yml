            - generic [ref=e647]:
              - generic [ref=e648]:
                - heading "Who we are" [level=2] [ref=e650]
                - generic [ref=e651]: "VOIS (Vodafone Intelligent Solutions) is a strategic arm of Vodafone Group Plc, creating value for customers by delivering intelligent solutions through Talent, Technology & Transformation. As the largest shared services organisation in the global telco industry with 30,000 FTE, our portfolio of next-generation solutions and services are designed in partnership with customers across Vodafone Group, local markets, and partner markets to simplify and drive growth. With our strategic partner Accenture, we work alongside our Vodafone customers, other Telco and tech companies to drive transformation, meet the challenges of our industry and ensure we stay relevant and resilient. This partnership is a unique, industry-first model which brings together the best of in-house and 3rd party capability. We work with customers across 28 countries from 10 VOIS locations: Albania, Egypt, Hungary, India, Romania, Spain, Turkey, UK, Germany, Ireland, and with a network of teams in Czech Republic, Italy, Greece, and Portugal. #VOIS #BeUnrivalled #CreateTheFuture"
              - generic [ref=e653]:
                - heading "About this Role" [level=2] [ref=e655]
                - generic [ref=e656]: We are seeking a skilled and motivated Software Engineer to join our microservices integration team within VOIS India. This role focuses on designing and building scalable, cloud-based integration solutions using modern microservices architecture. The successful candidate will work within a Scrum squad in a SAFe environment to deliver robust, high-quality APIs and services, contributing to the transformation of Vodafone’s integration layer and enhancing seamless data flow across systems.
              - generic [ref=e658]:
                - heading "What you will do" [level=2] [ref=e660]
                - list [ref=e662]:
                  - listitem [ref=e663]: Develop and maintain microservices within a Scrum/Kanban squad operating in a SAFe framework
                  - listitem [ref=e664]: Design and build solutions using TIBCO technologies (EMS, BW, Admin)
                  - listitem [ref=e665]: Develop and enhance RESTful APIs within a microservices architecture
                  - listitem [ref=e666]: Ensure quality, reliability, and performance of owned services using best practices
                  - listitem [ref=e667]: Participate in sprint planning, backlog refinement, and delivery of user stories
                  - listitem [ref=e668]: Apply continuous improvement through learning, collaboration, and feedback
                  - listitem [ref=e669]: Maintain high standards of code quality, testing (including JUnit), and defect resolution
                  - listitem [ref=e670]: Support integration across systems using event-driven architecture and messaging tools such as Kafka and RabbitMQ
              - generic [ref=e671]:
                - heading "Who you are" [level=2] [ref=e673]
                - list [ref=e675]:
                  - listitem [ref=e676]: Experienced in developing applications using TIBCO (EMS, BW, Admin)
                  - listitem [ref=e677]: Strong knowledge of REST APIs and microservices architecture
                  - listitem [ref=e678]: Proficient in Java and frameworks such as Spring Boot
                  - listitem [ref=e679]: Understanding of SOA principles, object-oriented programming, and collections
                  - listitem [ref=e680]: Experience with data streaming and storage technologies such as Kafka and MongoDB
                  - listitem [ref=e681]: Familiarity with DevOps tools and practices including Maven, Git, Jenkins, and branching strategies
                  - listitem [ref=e682]: Exposure to containerisation using Docker and orchestration tools such as Kubernetes
                  - listitem [ref=e683]: Knowledge of event-driven architecture, Apache Camel, routers and processors
                  - listitem [ref=e684]: Experience with performance tuning, caching, and monitoring tools such as Splunk, Prometheus, Grafana, or AppDynamics
                  - listitem [ref=e685]: Strong problem-solving mindset with a passion for learning and improving
                  - listitem [ref=e686]: Ability to collaborate effectively and contribute to team success
              - generic [ref=e687]:
                - heading "Not a Perfect Fit?" [level=2] [ref=e689]
                - generic [ref=e690]: Concerned you may not meet every requirement? Vodafone is committed to creating an inclusive workplace where everyone can thrive. If you are excited about this role but your experience does not align exactly with every aspect of the job description, you are encouraged to apply. You may be the right candidate for this or another opportunity, and the recruitment team will support you in exploring where your skills fit best.
              - generic [ref=e692]:
                - heading "What’s in it for you" [level=2] [ref=e694]
                - list [ref=e696]:
