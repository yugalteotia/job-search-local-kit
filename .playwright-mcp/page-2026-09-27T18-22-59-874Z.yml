                  - listitem [ref=e710]: Event-driven architecture using Kafka and messaging platforms
                  - listitem [ref=e711]: CI/CD practices and DevOps toolchains
                  - listitem [ref=e712]: Observability and performance monitoring using industry-standard tools
              - generic [ref=e713]:
                - heading "VOIS Equal Opportunity Employer Commitment" [level=2] [ref=e715]
                - generic [ref=e716]: Vodafone recognises and celebrates the value of diversity in building a workforce that reflects the customers and communities it serves. No form of discrimination is tolerated. This includes, but is not limited to, discrimination based on race, colour, age, veteran status, gender identity, gender expression, sexual orientation, pregnancy, maternity or parental status, ethnicity, disability, religion or belief, political affiliation, trade union membership, nationality, citizenship, indigenous status, medical condition, HIV status, neurodiversity, social origin, cultural background, marital or civil partnership status, or socio-economic background.
              - generic [ref=e718]:
                - heading "Join Us" [level=2] [ref=e720]
                - generic [ref=e721]: At Vodafone, we’re working hard to build a better future. A more connected, inclusive and sustainable world. As a dynamic global community, it's our human spirit, together with technology, that empowers us to achieve this. We challenge and innovate in order to connect people, businesses, and communities across the world. Delighting our customers and earning their loyalty drive us, and we experiment, learn fast and get it done, together. With us, you can be truly be yourself and belong, share inspiration, embrace new opportunities, thrive, and make a real difference.
