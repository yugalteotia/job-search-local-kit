                  - listitem [ref=e698]: Exposure to modern integration patterns and enterprise-grade systems
                  - listitem [ref=e699]: Collaborative Agile work environment with cross-functional teams
                  - listitem [ref=e700]: Continuous learning through hands-on experience, certifications, and coaching
                  - listitem [ref=e701]: Chance to contribute to transformation initiatives impacting millions of customers
              - generic [ref=e702]:
                - heading "What skills you will learn" [level=2] [ref=e704]
                - list [ref=e706]:
                  - listitem [ref=e707]: Advanced microservices architecture and integration design patterns
