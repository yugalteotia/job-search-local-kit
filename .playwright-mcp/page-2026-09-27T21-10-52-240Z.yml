                        - generic [ref=f15e133]: "SIGNATURE AND UNDERSTANDING:"
                      - generic [ref=f15e137]: I understand that if I have misrepresented information in this application or in any accompanying document or resume which I may submit in support of this application, or if I have omitted any material facts, Optum Global Solutions (India) Pvt. Ltd. ("OGS")will not consider me for employment. If I become employed by OGS, and any misrepresentation falsification or omission is discovered after I have begun employment, I understand that my employment with OGS may be subject to termination.
                      - generic [ref=f15e141]: Given that the Internet is a global environment, using the Internet to collect and process personal data necessarily involves the transmission of data on an international basis. Therefore, by submitting your resume and communicating electronically with us, you acknowledge and hereby provides your consent to our internal processing of your personal data in this way. Once you have uploaded a resume on the provided link, you can update or ask us to remove your resume from our Database at any point of time.
                      - paragraph [ref=f15e147]:
                        - generic [ref=f15e148]: You understand that your resume and accompanying materials will be used by OGS for purposes of assessing your eligibility for available positions, processing your application and corresponding with you about suitable opportunities at OGS as they arise. Before confirming a job offer, OGS will also conduct various background checks, to the extent allowed by applicable laws, which will involve vetting and verification of your background and the information supplied in order to assess your eligibility for the position, for example searches and verification of educational history and qualifications, employment history and reference checks, financial or credit reference checks, criminal records checks, legal and professional sanctions checks and staff fraud checks. Your information will be stored in a centralized database and may be shared with OGS's affiliates and service providers located outside the European Economic Area where the data protection standards may not be equivalent to those of your country of residence. Once you have supplied us with your information, you can update or ask us to remove your information from our database at any time. You also have the option to delete your information directly in the system. If your application is unsuccessful, we will continue to retain your information for a period of 3 years to assess your suitability for future positions, unless you inform us otherwise.
                      - paragraph [ref=f15e149]
                      - paragraph [ref=f15e153]:
                        - generic [ref=f15e154]: At Optum we are continually in search of talent and Optum strictly discourages the practice of soliciting financial consideration in lieu of employments. In case someone approaches you in this regards, please report it at Optum immediately.
                      - paragraph [ref=f15e157]:
                        - generic [ref=f15e158]: Also, please attest that you have not paid any money in lieu of a job with us. If you are found involved in financial consideration for employment, a strict action will be taken against you which includes but not limited to termination.
