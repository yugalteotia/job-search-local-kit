                  - paragraph [ref=e301]:
                    - generic [ref=e302]: Software development was never just about writing code.Today, AI can write a function, generate an API, build a UI, or even create an entire feature from a prompt.But real development starts after the code is generated.How will it scale?What happens when traffic increases?How will you handle caching, queues, retries, rate limiting and failures?What about database indexing, transactions, concurrency and race conditions?How will services communicate?How will you handle authentication, authorization, security and data consistency?What happens when a service goes down?Redis, Kafka, Docker, Kubernetes, load balancing, pub/sub, idempotency, circuit breakers, observability, database design, system architecture...These aren't just technical terms to memorize.This is the engineering behind the code.AI can help us write code faster.But understanding what to build, why to build it, how it should behave, and what can go wrong is still the real challenge.Coding is becoming easier.Engineering is not.
