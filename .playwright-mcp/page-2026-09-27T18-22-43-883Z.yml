                      - text: "🏴‍☠️ Adding another layer to the stack:"
                      - strong [ref=e581]: AI Security Certified
                      - text: "This one's squarely in the AI Offensive Security space Spent the last few hours; Here's the outcome:1. I identified and exploited AI attack surfaces - prompt injection, RAG poisoning, tool abuse, memory poisoning - the kind of stuff that sounds abstract until you've watched it work firsthand.2. I manipulated AI agent planning and MCP configurations to see exactly how unauthorized access and control can slip in when these systems aren't locked down properly.3. I structured and engineered prompts specifically to control and override AI system behavior - which is a strange skill to build, honestly. You spend years learning to write clear instructions for machines, then you spend a course learning how to break that same trust.4. I applied trust boundary analysis to actually distinguish trusted from untrusted data inside AI architectures - a distinction a lot of current AI deployments blur without realizing it.5. And underneath all of that, I circled back to fundamentals: securing core services - IAM, RBAC, compute, and storage - because none of the flashy AI-specific attacks matter if the basics aren't solid.Finally, mapped classified AI security risks using the OWASP Top 10 for LLM Applications and MITRE ATLAS."
