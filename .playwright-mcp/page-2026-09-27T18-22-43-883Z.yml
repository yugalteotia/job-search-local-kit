                  - paragraph [ref=e905]:
                    - generic [ref=e906]:
                      - text: "You can't wish your way into great relationships.I've had the pleasure of training over 50,000 client-facing professionals.And without fail, there's always someone who's read every book under the sun, hoping it'll grow their book of business.How to Win Friends and Influence People.Influence: The Psychology of Persuasion.To Sell Is Human.That's a wonderful place to start.But if you want to improve, at some point BD has to become something you go and practice.Practicing it is simple:1/ Pick one person and give first, before anything is owed.2/ Make it one of the four gifts:↳ An insight.↳ An introduction.↳ A bit of expertise.↳ An experience they'll remember.3/ Do it again next week, and the week after that.I know that first step feels like the scary part. But when Vanessa Bohns and Frank Flynn studied it, they found we underestimate how often people say yes by about 50%. The rejection we brace for mostly lives in our heads.So the real gap for most of us was never knowledge. It's the reps we haven't done yet.Every professional I've watched grow started right here, giving to one relationship at a time, week after week.You already know enough to help someone this week. That's all it takes to start.What's one relationship you could give to this week?(Image Credit:"
