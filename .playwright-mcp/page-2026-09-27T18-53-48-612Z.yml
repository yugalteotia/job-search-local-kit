          - paragraph [ref=e20]:
            - strong [ref=e21]: About AQR Capital Management
          - paragraph [ref=e22]: AQR is a global investment management firm built at the intersection of financial theory and practical application. We strive to deliver superior, long-term results for our clients by seeking to filter out market noise to identify and isolate what matters most, and by developing ideas that stand up to rigorous testing. Underpinning this philosophy is an unrelenting commitment to excellence in technology — powering our insights and analysis. This unique combination has made us leaders in alternative and traditional strategies since 1998.
          - paragraph [ref=e23]: AQR takes a systematic, research-driven approach, applying quantitative tools to process fundamental information and manage risk. Our clients include institutional investors, such as pension funds, insurance companies, endowments, foundations and sovereign wealth funds, as well as financial advisors.
          - paragraph [ref=e24]:
            - strong [ref=e25]
          - paragraph [ref=e26]: Technology is central to AQR’s success. As a Software Engineer in Portfolio Implementation, you will work on mission-critical systems that turn investment ideas into reality. Partnering closely with researchers and portfolio managers, you will design and build proprietary tools that support quantitative strategy research and systematic investing at scale.
          - paragraph [ref=e27]:
            - strong [ref=e28]: Your Role
            - text: ":"
          - paragraph [ref=e29]: "As a Software Engineer in Portfolio Implementation, you will design, build, and extend systems that sit at the core of AQR’s investment process, including:"
          - list [ref=e30]:
            - listitem [ref=e31]: Portfolio Implementation platforms that consume research outputs, perform constrained optimizations, and generate orders
          - list [ref=e32]:
            - listitem [ref=e33]: Cloud-based microservices engineered to run reliably and efficiently at scale
          - list [ref=e34]:
            - listitem [ref=e35]: Participate in architectural design discussions for high-performance, high-volume, highly available systems, gaining experience with trade-offs across performance, flexibility, and maintainability
          - list [ref=e36]:
            - listitem [ref=e37]: Bespoke technology solutions tailored to specific asset classes and evolving research needs
          - list [ref=e38]:
            - listitem [ref=e39]: Collaboration with a global team of researchers, portfolio managers and engineers for successful product delivery
