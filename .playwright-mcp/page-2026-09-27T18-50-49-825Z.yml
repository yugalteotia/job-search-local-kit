        - generic [ref=e25]: Hevo is a simple, intuitive, and powerful No-code Data Pipeline platform that enables companies to consolidate data from multiple software for faster analytics.
        - generic [ref=e26]: Hevo powers data analytics for 2000+ data-driven companies across multiple industry verticals including Deliverr, Neo4J, Groww, Marqeta, and Betway. By automating complex data integration tasks, Hevo allows data teams to focus on deriving groundbreaking insights and driving their businesses forward.
        - generic [ref=e27]: "Hevo’s mission is simple, but bold: Build technology from India, for the world that is simple to adopt and easy to access so that everyone can unlock the potential of data."
        - generic [ref=e28]: Based in San Francisco and Bangalore, Hevo has seen exponential growth since its inception. The team has grown by 3X and the customer base has expanded by a staggering 20X in just the last two years.
        - generic [ref=e29]: With a total funding of $42 Mil from Sequoia India, Qualgro, and Chiratae Ventures, Hevo is now entering a new phase of hyper-growth.
        - generic [ref=e30]: Hevoites are a bunch of thoughtful, helpful problem solvers, who are obsessed with making a difference in the lives of their customers, colleagues and their own individual trajectory.
        - generic [ref=e31]: If you are someone who is passionate about redefining the future of technology, then Hevo is the place for you.
