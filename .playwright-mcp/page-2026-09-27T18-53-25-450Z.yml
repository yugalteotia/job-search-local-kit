            - paragraph [ref=e21]:
              - strong [ref=e22]:
                - emphasis [ref=e23]: OUR MISSION
            - paragraph [ref=e24]:
              - strong [ref=e25]:
                - emphasis [ref=e26]: At Redwood, we empower our customers with lights-out automation for their mission-critical business processes.
            - paragraph [ref=e27]:
              - strong [ref=e28]:
                - emphasis [ref=e29]: ABOUT US
            - paragraph [ref=e30]: Redwood Software is the leading orchestration platform for the autonomous enterprise, driving business transformation at the lowest total cost of ownership. Redwood empowers organizations to intelligently automate and orchestrate mission-critical business and IT processes across complex ERP, hybrid cloud, data and emerging agentic AI systems. Through its SaaS-first automation fabric—with AI embedded across the automation lifecycle—Redwood accelerates the path to autonomous operations. Backed by 30 years of experience and trusted by more than 50% of the Fortune 50, Redwood helps organizations unlock human potential to focus on innovation, growth and what’s next.
            - paragraph [ref=e31]:
              - strong [ref=e32]: CORE VALUES
            - paragraph [ref=e33]: One Team. One Redwood
            - paragraph [ref=e34]: Make Your Own Weather
            - paragraph [ref=e35]: Obsess over Customer Success
            - paragraph [ref=e36]: Work the Problem
            - paragraph [ref=e37]: Be Curious
            - paragraph [ref=e38]: Own the Outcome
            - paragraph [ref=e39]: Respect Each Other
            - paragraph [ref=e40]:
              - strong [ref=e41]:
                - emphasis [ref=e42]: YOUR IMPACT
            - paragraph [ref=e43]:
              - text: We are looking for a
              - strong [ref=e44]: Software Engineer, Platform & Integrations
              - text: . Working closely with senior and lead engineers, you will design, develop, and maintain high-quality features that power enterprise data exchange for more than 1,000 customers worldwide.
            - paragraph [ref=e45]: This is an incredible opportunity to deepen your expertise in cloud-native architectures, enterprise security, and modern DevOps practices in a fast-growing product environment.
            - list [ref=e46]:
              - listitem [ref=e47]:
                - paragraph [ref=e48]: "Feature Development & Design: Write clean, maintainable, and well-tested code using Java and Spring Boot to deliver scalable backend services and microservices."
              - listitem [ref=e49]:
                - paragraph [ref=e50]: "Platform Reliability: Contribute to enhancing the monitoring, logging, and observability of our core platform to ensure high availability and performance."
              - listitem [ref=e51]:
                - paragraph [ref=e52]: "Security & Compliance: Implement secure coding practices to safeguard data exchange and maintain compliance across our cloud infrastructure."
              - listitem [ref=e53]:
                - paragraph [ref=e54]: "Collaborative Execution: Work within an agile team, collaborating closely with QA, Product, and fellow engineers to deliver high-quality software sprints on time."
              - listitem [ref=e55]:
                - paragraph [ref=e56]: "Innovation & Curiosity: Stay curious about emerging technologies—including cloud native optimizations and AI/ML concepts—and help explore ways to apply them to our product."
            - paragraph [ref=e57]:
              - strong [ref=e58]:
                - emphasis [ref=e59]: YOUR EXPERIENCE
            - list [ref=e60]:
              - listitem [ref=e61]:
                - paragraph [ref=e62]: "Education: Bachelor’s degree in Computer Science, Engineering, or a related field."
              - listitem [ref=e63]:
                - paragraph [ref=e64]: "Product Experience: 2+ years of professional software engineering experience, ideally within a product-driven company."
              - listitem [ref=e65]:
                - paragraph [ref=e66]: "Core Tech Stack: Strong foundation in Java, Spring Boot, and REST API development, with a solid understanding of object-oriented programming (OOP) and design patterns."
              - listitem [ref=e67]:
                - paragraph [ref=e68]: "Database Systems: Proficiency in SQL and relational database management, such as PostgreSQL or MySQL"
              - listitem [ref=e69]:
                - paragraph [ref=e70]: "Cloud & DevOps Familiarity: Practical exposure to cloud platforms (AWS preferred) and standard CI/CD deployment pipelines. Experience with Docker or Kubernetes/EKS is a strong plus."
              - listitem [ref=e71]:
                - paragraph [ref=e72]: "Engineering Best Practices: Proven track record of writing automated tests (unit, integration) and participating in constructive code reviews."
              - listitem [ref=e73]:
                - paragraph [ref=e74]: "Protocols & Integrations: Familiarity with standard networking or file transfer protocols (e.g., SFTP, HTTP, AS2) is highly desirable."
              - listitem [ref=e75]:
                - paragraph [ref=e76]: "Soft Skills: Strong problem-solving abilities, excellent communication skills, and a desire to learn from senior engineering peers."
              - listitem [ref=e77]:
                - paragraph [ref=e78]: "Agile Mindset: Experience working within Agile/Scrum development methodologies."
          - generic [ref=e82]:
