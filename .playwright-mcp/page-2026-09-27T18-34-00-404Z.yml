                      - paragraph [ref=e4444]
                      - paragraph [ref=e4445]: At SolarSquare we are building the Home-Energy brand of future India. We help homes switch to rooftop solar and move away from traditional coal electricity. We are a full-stack D2C residential solar brand - designing, installing, maintaining (after-sales) and financing solar systems for home-owners across India.
                      - paragraph [ref=e4446]: In 3 years we have scaled to become the leading residential solar brand in India. We are obsessed with quality, customer service and innovating to make it simple for homes to switch to solar. We are looking for leaders to join us in this mission.
                      - paragraph [ref=e4447]
