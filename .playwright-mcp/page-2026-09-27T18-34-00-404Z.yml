                      - paragraph [ref=e1082]: Competitive compensation with equity. Direct ownership of a charter that materially affects how enterprise customers experience our product.
                      - paragraph [ref=e1083]: Proximity to frontier AI systems in production, and the freedom to use modern tooling to do your job well.
                      - paragraph [ref=e1084]: A fast-moving team where the distance between an idea and a shipped change is short.
