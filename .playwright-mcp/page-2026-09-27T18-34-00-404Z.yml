                      - paragraph [ref=e807]: We are looking for a Senior Software Engineer who will be driving architectural direction, multi-team initiatives, and the development of highly scalable distributed systems. You will partner with Product, Architecture, DevOps and cross-functional engineering teams to deliver impactful technology solutions across a complex digital ecosystem. You will independently define and deliver large-scale, multi-phase projects, mentor engineers, and shape technical strategy. The role also includes leveraging LLMs and GenAI-driven tools to enhance engineering productivity, reduce cycle time, and build the next generation of internal developer experience tools.
