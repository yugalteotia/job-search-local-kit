                      - paragraph [ref=e906]:
                        - strong [ref=e907]: About StrideOne
                      - paragraph [ref=e908]: StrideOne is a leading fintech platform enabling businesses with innovative supply chain finance and working capital solutions. We partner with enterprises, MSMEs, and financial institutions to simplify access to credit through technology-driven lending solutions. At StrideOne, you'll work in a fast-paced, collaborative environment where innovation, ownership, and continuous learning are encouraged.
                      - paragraph [ref=e909]
                      - paragraph [ref=e910]:
                        - strong [ref=e911]: About the Role
                      - paragraph [ref=e912]: We're building Credit Engine, a lending platform on top of Apache Fineract that powers credit assessment, disbursement, repayment, and portfolio management for our clients. We're looking for a Java Developer to help build and scale the backend services behind these workflows.
                      - paragraph [ref=e913]
                      - paragraph [ref=e914]:
                        - strong [ref=e915]: What You'll Work On
                      - list [ref=e916]:
                        - listitem [ref=e917]: Build and maintain backend services for lending functions — organisation/office management, portfolio and product configuration, cash margin engines, and credit workflows.
                        - listitem [ref=e918]: Design and consume REST APIs integrating with internal modules and external banking/financial partners.
                        - listitem [ref=e919]: Extend Apache Fineract to support custom lending products and business rules.
                        - listitem [ref=e920]: Design and optimize MySQL schemas/queries for transactional, audit-heavy financial data.
