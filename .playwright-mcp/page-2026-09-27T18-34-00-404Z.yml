                        - strong [ref=e4906]: Senior QA Engineer
                      - paragraph [ref=e4907]
                      - paragraph [ref=e4908]:
                        - strong [ref=e4909]: Make quality part of the engineering system.
                      - paragraph [ref=e4910]: "AbleCredit builds software for complex enterprise workflows where AI, APIs, business rules, human decisions, and real-world operations have to work together reliably. We care about building products that work in production - not just in demos. We're looking for a senior quality engineer who can move quality upstream: from release-time testing to better automation, contracts, observability, and engineering practices."
                      - paragraph [ref=e4911]
                      - paragraph [ref=e4912]:
                        - strong [ref=e4913]: What You'll Own?
                      - paragraph [ref=e4914]: • Own quality strategy across web, mobile, backend APIs, integrations, and end-to-end workflows.
                      - paragraph [ref=e4915]: • Design and maintain automated regression suites for critical customer journeys.
                      - paragraph [ref=e4916]: • Build API, integration, contract, and workflow tests that catch failures before production.
                      - paragraph [ref=e4917]: • Partner with engineering and product teams during design - not only after development is complete.
                      - paragraph [ref=e4918]: • Define release readiness, risk-based testing, and production validation practices.
                      - paragraph [ref=e4919]: • Investigate escaped defects, identify systemic causes, and drive preventive improvements.
                      - paragraph [ref=e4920]: • Improve test data, environments, tooling, and CI integration so teams can ship confidently.
                      - paragraph [ref=e4921]
                      - paragraph [ref=e4922]:
                        - strong [ref=e4923]: What We're Looking For?
                      - paragraph [ref=e4924]: • 5+ years in software quality engineering or test automation.
                      - paragraph [ref=e4925]: • Strong API and backend testing experience, including asynchronous and integration-heavy systems.
                      - paragraph [ref=e4926]: • Experience testing mobile and web applications and understanding client/ server failure modes.
                      - paragraph [ref=e4927]: • Ability to write automation in JavaScript/ TypeScript, Python, Java, or a similar language.
                      - paragraph [ref=e4928]: • Strong debugging skills across logs, network requests, databases, and distributed services.
                      - paragraph [ref=e4929]: • Experience with CI/CD and integrating automated tests into release pipelines.
                      - paragraph [ref=e4930]: "• A product mindset: prioritize risk and customer impact rather than maximizing test-case counts."
                      - paragraph [ref=e4931]
                      - paragraph [ref=e4932]:
                        - strong [ref=e4933]: Nice to Have
                      - paragraph [ref=e4934]: • Performance, load, security, or reliability testing.
                      - paragraph [ref=e4935]: • Experience with Playwright, Cypress, Appium, Postman/ Newman, k6, or similar tooling.
                      - paragraph [ref=e4936]: • Experience with event-driven systems, queues, webhooks, and long running workflows.
                      - paragraph [ref=e4937]: • Experience testing AI-assisted or non-deterministic product behavior.
                      - paragraph [ref=e4938]
                      - paragraph [ref=e4939]:
                        - strong [ref=e4940]: How We Think About Quality?
                      - paragraph [ref=e4941]: "Quality is an engineering responsibility. Automation should create confidence, not dashboards. A production escape should improve the system that allowed it to happen. The goal is simple: ship quickly without making customers our test environment."
