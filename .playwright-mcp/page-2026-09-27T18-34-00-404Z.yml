                      - paragraph [ref=e4331]: We’re on the hunt for a Principal Engineer who loves solving tough problems, mentoring others, and shaping the future of our platform. In this role, you’ll be leading the design and build of scalable systems and integrations across major cybersecurity platforms. Sometimes you’ll be deep in the code, other times you’ll be guiding teams and customers to the right solutions. If you enjoy balancing hands-on work with big-picture thinking, this could be your spot.
                      - paragraph [ref=e4332]:
                        - strong [ref=e4333]: About Us
                      - paragraph [ref=e4334]: At Metron Security, we help top cybersecurity companies supercharge their tools through automation and integrations. Our engineers connect and extend platforms like Splunk, IBM QRadar, ServiceNow, CrowdStrike, Cybereason, and many more. We believe in a developer-first culture where creativity, ownership, and continuous learning drive everything we do.
                      - paragraph [ref=e4335]: Why You’ll Love Working Here
                      - list [ref=e4336]:
                        - listitem [ref=e4337]: A true developer-first environment where your ideas and technical chops matter.
                        - listitem [ref=e4338]: Hands-on exposure to 250+ security platforms (yep, really).
                        - listitem [ref=e4339]: Direct contact with customers so you can see the impact of your work right away.
                        - listitem [ref=e4340]: A fast-paced, growth-focused culture—but we also respect work-life balance. No weekends, and only occasional evening calls.
                      - paragraph [ref=e4341]:
                        - strong [ref=e4342]: What We’re Looking For
                      - paragraph [ref=e4343]: We’re hoping to meet someone who has both deep technical expertise and natural leadership instincts. You think holistically about systems, enjoy digging into tricky problems, and can guide both teammates and customers to success.
                      - paragraph [ref=e4344]:
                        - strong [ref=e4345]: Must-Have Skills
                      - list [ref=e4346]:
                        - listitem [ref=e4347]: Solid programming experience across multiple languages (Python, TypeScript, Java, Node.js, Angular, React, C#, C++… we’re language-agnostic and use the best tool for the job).
                        - listitem [ref=e4348]: Quick at learning new security platforms.
                        - listitem [ref=e4349]: Proven ability to design and build scalable systems, APIs, and integrations.
                        - listitem [ref=e4350]: Experience mentoring and leading engineering teams.
                        - listitem [ref=e4351]: Strong debugging and problem-solving skills in complex environments.
                        - listitem [ref=e4352]: Organized, reliable, and able to set and meet clear timelines.
                        - listitem [ref=e4353]: Comfortable working directly with customers to understand needs and design solutions.
                        - listitem [ref=e4354]: Familiar with cloud platforms (AWS, GCP, or Azure) and security best practices.
                      - paragraph [ref=e4355]:
                        - strong [ref=e4356]: Bonus Points If You
                      - list [ref=e4357]:
                        - listitem [ref=e4358]: Have experience building or leading integrations with enterprise security tools.
                        - listitem [ref=e4359]: Like approaching challenges with a “hacker mindset.”
                        - listitem [ref=e4360]: Know your way around Docker, Kubernetes, and cloud deployments.
                        - listitem [ref=e4361]: Contribute to open source or share technical insights publicly.
                      - paragraph [ref=e4362]:
                        - strong [ref=e4363]: What You’ll Do
                      - list [ref=e4364]:
                        - listitem [ref=e4365]: Be the face of Metron Security with our customers—collaborating on solutions and keeping communication clear.
                        - listitem [ref=e4366]: Bridge the gap between customers and our dev team, ensuring the right info flows both ways.
                        - listitem [ref=e4367]: Mentor and train junior developers, helping them level up.
                        - listitem [ref=e4368]: Step in to tackle tough technical problems when the team needs backup.
                        - listitem [ref=e4369]: Build and document knowledge about security platforms.
                        - listitem [ref=e4370]: Spot potential roadblocks early and help keep projects on track.
