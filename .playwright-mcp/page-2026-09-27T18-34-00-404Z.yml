                      - paragraph [ref=e2007]: Supercharge Your Career as a Principal Lead Developer at Technoidentity!
                      - paragraph [ref=e2008]: At Technoidentity, we're a Data & AI product engineering company with over 15 years of expertise in building durable digital products, intelligent enterprise solutions, and scalable Data & AI platforms. As we continue expanding globally, it's the perfect time to join our team of tech innovators and make a lasting impact.
                      - paragraph [ref=e2009]
                      - paragraph [ref=e2010]: What’s in it for You?
                      - paragraph [ref=e2011]: Technoidentity is building a high-impact Temporal Capability Center to design, deliver, and scale resilient workflow-orchestration solutions for enterprise customers. We are seeking a hands-on, technically strong Principal Lead Developer who combines deep software-engineering expertise with solution-architecture leadership, distributed-systems knowledge, and an ownership mindset.
                      - paragraph [ref=e2012]: This role is suited to a resourceful engineer who can independently take multi-faceted business and technical requirements from discovery through design, implementation, rollout, and operational improvement. You will work directly with overseas clients, shape architecture decisions, lead multiple technical workstreams, and mentor junior developers while remaining actively involved in code, design reviews, and delivery.
                      - paragraph [ref=e2013]: The ideal candidate has strong practical experience in Python, Java, and/or TypeScript, has experience with Cloud Platforms, understands modern AI-assisted engineering practices. Experience with distributed workflow solutions using orchestration platforms such as Temporal, Cadence, Camunda, or similar technologies will be preferred, but is not a requirement.
                      - paragraph [ref=e2014]
                      - paragraph [ref=e2015]
                      - paragraph [ref=e2016]: Requirements
                      - paragraph [ref=e2017]: What Will You Be Doing?
                      - list [ref=e2018]:
                        - listitem [ref=e2019]: Lead the end-to-end technical delivery of workflow-orchestration and distributed-systems solutions for enterprise clients.
                        - listitem [ref=e2020]: Design robust, scalable, secure, and observable architectures using durable execution, asynchronous messaging, APIs, event-driven patterns, and cloud-native components.
                        - listitem [ref=e2021]: Build production-grade services and workflow implementations using Python, Java, and/or TypeScript.
                        - listitem [ref=e2022]: Design and implement long-running business processes using orchestration frameworks such as Temporal, Cadence, Camunda, or equivalent platforms.
                        - listitem [ref=e2023]: Apply distributed-systems principles to address reliability, idempotency, retries, timeouts, compensating transactions, eventual consistency, failure recovery, and data consistency.
                        - listitem [ref=e2024]: Design and implement Saga patterns, including orchestration-based and choreography-based approaches, for multi-service business transactions.
                        - listitem [ref=e2025]: Lead architecture discovery sessions, technical workshops, solution presentations, and design reviews with overseas clients and internal stakeholders.
                        - listitem [ref=e2026]: Translate business requirements into clear solution architectures, implementation plans, technical specifications, estimates, and delivery milestones.
                        - listitem [ref=e2027]: Drive multiple concurrent technical streams, identify dependencies and risks early, and maintain delivery quality under changing priorities.
                        - listitem [ref=e2028]: Establish engineering standards for workflow design, API contracts, error handling, versioning, testing, deployment, observability, and operational readiness.
                        - listitem [ref=e2029]: Use AI-assisted SDLC practices responsibly to improve developer productivity, code quality, test coverage, documentation, and delivery velocity.
                        - listitem [ref=e2030]: Design and contribute to agentic orchestration solutions, including coordination of AI agents, tool/API integrations, workflow state management, guardrails, human-in-the-loop controls, and evaluation approaches where relevant.
                        - listitem [ref=e2031]: Perform hands-on development of critical components, prototypes, integrations, and reference implementations.
                        - listitem [ref=e2032]: Conduct code reviews and architectural reviews, ensuring solutions are maintainable, performant, secure, and aligned with engineering best practices.
                        - listitem [ref=e2033]: Mentor and guide junior developers; support technical growth through pairing, reviews, reusable patterns, technical sessions, and constructive feedback.
                        - listitem [ref=e2034]: Collaborate with delivery, product, platform, QA, DevOps, security, and client teams to ensure successful implementation and production adoption.
                        - listitem [ref=e2035]: Contribute reusable assets, accelerators, templates, documentation, and best practices to the Temporal Capability Center.
                      - paragraph [ref=e2036]
                      - paragraph [ref=e2037]
                      - paragraph [ref=e2038]: Benefits
