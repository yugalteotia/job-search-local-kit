                      - paragraph [ref=e1061]:
                        - strong [ref=e1062]: What you'll own
                      - paragraph [ref=e1063]: "The quality charter. Define and evolve the testing strategy — web application, dashboards, APIs, webhooks, and customer integrations. Establish release criteria, coverage expectations, and quality gates that engineers actually respect because they're fast and they catch real bugs. Automation at scale. Build and maintain end-to-end and API automation suites that run on every PR and give a trustworthy signal. Own the flake rate. Design for parallel execution, deterministic test data, and fast feedback — a suite nobody trusts is worse than no suite. Performance and reliability. Design and run load, stress, and soak tests against APIs and the platform. Profile results, isolate bottlenecks with the engineers who own the service, and set up the monitoring that tells us about degradation before a customer does. Leverage through tooling, including AI. Use whatever gets coverage up and cycle time down: LLM-assisted test case generation from specs, AI-assisted authoring and maintenance of automation, synthetic test data generation, log and failure triage. We expect you to be opinionated about where these tools genuinely help and where they produce impressive-looking noise. Raising the bar. Partner with product and engineering from spec through release so quality risk is surfaced during design, not after code freeze. Mentor the QA team and build the practices — bug triage discipline, root cause analysis, prevention over detection — that outlast any single release."
                      - paragraph [ref=e1064]
                      - paragraph [ref=e1065]:
                        - strong [ref=e1066]: What we're looking for
                      - paragraph [ref=e1067]:
                        - strong [ref=e1068]: Must have
                      - paragraph [ref=e1069]: 3–6 years in QA roles, with meaningful ownership of automation frameworks rather than only executing existing suites.
                      - paragraph [ref=e1070]: Strong test automation skills with a modern framework — Playwright, Cypress, or Selenium — and solid coding ability in Python, JavaScript/TypeScript, or Java. You should be comfortable reading application code, not just testing around it.
                      - paragraph [ref=e1071]: "API testing experience: REST, auth, webhooks and asynchronous event flows, contract testing, and tooling such as Postman, REST Assured, or Pact."
                      - paragraph [ref=e1072]: Hands-on CI/CD integration — GitHub Actions, GitLab CI, Jenkins, or equivalent — including making suites fast and reliable enough to gate merges.
                      - paragraph [ref=e1073]: Working knowledge of SQL for validating data correctness, and comfort with logs, traces, and observability tooling for debugging.
                      - paragraph [ref=e1074]: Rigorous, systematic thinking about edge cases and failure modes, and the communication skills to make quality risk legible to product and leadership.
                      - paragraph [ref=e1075]:
                        - strong [ref=e1076]: Nice to have
                      - paragraph [ref=e1077]: Experience testing AI, ML, or LLM-based products, and comfort with the reality that outputs are probabilistic rather than deterministic. Familiarity with Docker, Kubernetes, or cloud infrastructure for standing up test environments.
                      - paragraph [ref=e1078]: Performance and load testing with k6, JMeter, Gatling, or Locust, plus the analytical ability to turn results into a specific, actionable bottleneck. Exposure to enterprise SaaS with real integration surface area, or to security and compliance testing expectations of enterprise buyers. - Experience as the first or most senior quality voice on a team.
