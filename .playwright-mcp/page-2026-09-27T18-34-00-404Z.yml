                        - strong [ref=e3265]: Job Description
                      - paragraph [ref=e3266]: We are seeking a highly skilled Senior Full-Stack Developer to design, develop, and deliver scalable, high-quality digital solutions. The ideal candidate combines deep expertise in modern microservices architecture, cloud platforms, and end-to-end feature delivery, with proficiency in agentic software development and a strong focus on engineering excellence, collaboration, and continuous innovation.
                      - paragraph [ref=e3267]: "Responsibilities:"
                      - paragraph [ref=e3268]: • Design and develop scalable, resilient applications using microservices architecture.
                      - paragraph [ref=e3269]: • Build end-to-end full-stack features, covering UI (React, TypeScript, Redux) and backend services.
                      - paragraph [ref=e3270]: • Develop Java (17+) / Spring Boot (3.x) microservices using Domain-Driven Design (DDD) and OpenAPI 3.x specifications.
                      - paragraph [ref=e3271]: • Implement event-driven architectures using Kafka, including topic design, consumer groups, and reliable message processing.
                      - paragraph [ref=e3272]: • Design optimized database schemas, write advanced SQL queries, and manage migrations using Liquibase within CI/CD pipelines.
                      - paragraph [ref=e3273]: • Lead low-level design (LLD) and define REST API and event contracts aligned with enterprise architecture standards.
                      - paragraph [ref=e3274]: • Conduct code reviews, enforce coding standards, and ensure high quality using SonarQube gates.
                      - paragraph [ref=e3275]: • Ensure high test coverage (>90%) using JUnit, Mockito, Testcontainers, Cucumber, Jest, and React Testing Library.
                      - paragraph [ref=e3276]: • Collaborate within Agile teams, mentor developers, and drive timely delivery of high-quality solutions.
                      - paragraph [ref=e3277]: • Leverage AWS, Docker, Kubernetes, CI/CD pipelines to improve productivity and system performance.
                      - paragraph [ref=e3278]: • Leverage AI-driven software engineering practices, including LLM-powered development tools, agentic AI workflows, code generation, automated testing, and AI-assisted debugging, to improve developer productivity, software quality, and delivery efficiency.
                      - paragraph [ref=e3279]: "Required Qualification:"
                      - paragraph [ref=e3280]: • Bachelor’s or Master’s degree in computer science, Information Technology, or a related field.
                      - paragraph [ref=e3281]: • Minimum 8 years of professional experience, including at least 5 years in full-stack development.
                      - paragraph [ref=e3282]: • Hands-on experience with microservices-based architecture and distributed systems.
                      - paragraph [ref=e3283]: • Strong understanding of functional programming, design patterns, and software architecture principles.
                      - paragraph [ref=e3284]: • Experience working in cloud environments (preferably AWS).
                      - paragraph [ref=e3285]: • Proficiency with CI/CD pipelines, Docker, and Kubernetes.
                      - paragraph [ref=e3286]: • Strong analytical thinking and problem-solving capabilities.
                      - paragraph [ref=e3287]: Must-Have Skills
                      - paragraph [ref=e3288]: • Strong proficiency in React.js, including Hooks, TypeScript, and state management using Redux Toolkit or React Query, along with testing frameworks such as Jest and React Testing Library.
                      - paragraph [ref=e3289]: • Extensive experience with Java 17+, Spring Boot 3.x, and the Spring ecosystem (Spring Cloud, Spring Security with OAuth 2.0), along with JPA/Hibernate.
                      - paragraph [ref=e3290]: • Hands-on experience with Apache Kafka, including topic design and managing consumer groups for event-driven architectures.
                      - paragraph [ref=e3291]: • Solid expertise in PostgreSQL, including schema design, performance tuning, indexing strategies, and database migration management using Liquibase.
                      - paragraph [ref=e3292]: • Proficiency in AI-assisted and agentic software development practices, with hands-on experience using AI coding assistants, autonomous development agents, and AI-enabled testing and code quality tools.
                      - paragraph [ref=e3293]: Good-to-Have Skills
                      - paragraph [ref=e3294]: • Experience with Redis, GraphQL, and AWS cloud services.
                      - paragraph [ref=e3295]: • Familiarity with AI-assisted development tools such as GitHub Copilot.
                      - paragraph [ref=e3296]: • Exposure to monitoring and observability tools like Kibana/ELK stack, Grafana, Glowroot, or Datadog.
                      - paragraph [ref=e3297]: • Experience working with modern development environments and IDEs (e.g., Kiro IDE).
