                      - paragraph [ref=e1229]:
                        - text: ·
                        - strong [ref=e1230]: JOB DESCRIPTION
                      - paragraph [ref=e1231]: Technical Delivery Manager – Services LOCATION Bengaluru (Hybrid) ABOUT GEMBA CONCEPTS EXPERIENCE 5–8 years REPORTS TO Chief Technology Officer TYPE Full-time Gemba Concepts helps manufacturers and enterprises improve how their operations run. Our technology division builds and runs Gemba Connect, a suite of enterprise SaaS products spanning warehouse management, logistics, ERP, and applied AI/ML, deployed across 30+ active client accounts in manufacturing, pharma, FMCG and retail.
                      - paragraph [ref=e1232]:
                        - strong [ref=e1233]: ABOUT THE ROLE
                      - paragraph [ref=e1234]: "We're looking for a technical leader to own Gemba's services business end to end: delivery, people, commercials and reporting. You'll run every client implementation and custom development engagement, build and manage the team that delivers them, and be the single point of accountability to clients and leadership for how services perform. You've written production Java code, can read a Spring Boot service and a SQL execution plan, and have since hired, reviewed and led delivery teams. The product roadmap stays with product leadership; everything we deliver to clients runs through you."
                      - paragraph [ref=e1235]
                      - paragraph [ref=e1236]:
                        - strong [ref=e1237]: WHAT YOU'LL OWN Services business ownership
                      - paragraph [ref=e1238]: "• Own the health of the services portfolio: delivery, client satisfaction, billing milestones and account growth."
                      - paragraph [ref=e1239]: • Run post-sale SOW execution. Ensure milestones are hit and billed on time, and follow up with finance and clients on receivables.
                      - paragraph [ref=e1240]: • Grow accounts by converting change requests and enhancements into scoped, priced, billable work.
                      - paragraph [ref=e1241]: • Track effort, utilisation and margin by account; act when an engagement turns unprofitable. Delivery
                      - paragraph [ref=e1242]: • Run multiple concurrent client implementations, owning scope, timeline, cost and quality.
                      - paragraph [ref=e1243]: "• Plan and run sprints with Tech Leads: grooming, estimation, capacity planning, reviews and retros."
                      - paragraph [ref=e1244]: • Own go-lives (UAT, cutover, data migration, hypercare) and post-go-live support SLAs.
                      - paragraph [ref=e1245]: • Maintain RAID logs and delivery dashboards; flag risk early, with a proposed fix. Requirements and change control
                      - paragraph [ref=e1246]: • Be the single intake point between consulting teams, clients and engineering; convert requirements into user stories with testable acceptance criteria.
                      - paragraph [ref=e1247]: • Baseline scope and run a formal change-request process. Every change is priced in effort, cost and date before it's accepted.
                      - paragraph [ref=e1248]: • Make sure what's agreed is documented before it's built. People and hiring • Plan services headcount against the delivery pipeline and run hiring end to end (role definition, interviews, closing) at a high bar.
                      - paragraph [ref=e1249]: • Run goal-setting, regular 1:1s and performance reviews for the services team; give input on promotions, compensation and performance plans.
                      - paragraph [ref=e1250]: • Grow Tech Leads and senior engineers into people who can own accounts independently.
                      - paragraph [ref=e1251]: • Own team retention and morale. Know who's at risk before they resign. Gemba Concepts · Technology Division Page 1GEMBA CONCEPTS · TECHNICAL DELIVERY MANAGER – SERVICES Reporting
                      - paragraph [ref=e1252]: "• Publish monthly services MIS to leadership: revenue billed, collections, on-time delivery, SLA adherence, utilisation, hiring and attrition."
                      - paragraph [ref=e1253]: • Contribute the services section to quarterly board reporting.
                      - paragraph [ref=e1254]: • Run monthly or quarterly business reviews with key client stakeholders. Technical oversight
                      - paragraph [ref=e1255]: • Work with Tech Leads on design reviews, integrations (ERP, WMS, third-party systems) and non-functional requirements.
                      - paragraph [ref=e1256]: • Lead incident triage and root-cause reviews on client escalations; track corrective actions to closure.
                      - paragraph [ref=e1257]: • Coordinate with DevOps on environments, CI/CD and release windows.
                      - paragraph [ref=e1258]: • Uphold security and compliance controls (e.g., SOC 2) across delivery. Improving how we deliver
                      - paragraph [ref=e1259]: • Drive adoption of AI-assisted development and testing tools, and measure whether they actually raise throughput per engineer.
                      - paragraph [ref=e1260]: • Tighten estimation accuracy, definition of done and release discipline across the services team. MUST-HAVES
                      - paragraph [ref=e1261]: • 5–8 years in software, including 2+ years as a hands-on Java developer and 2+ years in delivery or project management.
                      - paragraph [ref=e1262]: • 1+ year leading a team of 5+ directly, including hiring and performance reviews.
                      - paragraph [ref=e1263]: • Strong working knowledge of Java and Spring Boot. You can review a PR, understand how a service is structured, and challenge an estimate.
                      - paragraph [ref=e1264]: "• Solid SQL: schema design, writing and debugging queries, and understanding of indexing, transactions and production issues such as slow queries and connection pool exhaustion (SQL Server/Azure SQL, PostgreSQL or MySQL)."
                      - paragraph [ref=e1265]: • Hands-on exposure to cloud platforms (Azure preferred, AWS/GCP acceptable).
                      - paragraph [ref=e1266]: "• Working experience with the commercial side of client engagements: SOWs, milestone billing and change orders. Margin tracking is a plus."
                      - paragraph [ref=e1267]: • Track record of delivering enterprise B2B software to external clients across multiple parallel engagements.
                      - paragraph [ref=e1268]: • Proficiency with Jira or Azure DevOps, Confluence and Git-based workflows.
                      - paragraph [ref=e1269]: • Clear communication. You can present to a client CXO, write a board-ready MIS, and give an engineer hard feedback. GOOD TO HAVE
                      - paragraph [ref=e1270]: • Domain experience in manufacturing, supply chain, warehousing, logistics or ERP.
                      - paragraph [ref=e1271]: • Background in an IT services firm or the services arm of a product company.
                      - paragraph [ref=e1272]: • Familiarity with microservices, REST API design and message queues.
                      - paragraph [ref=e1273]: • Experience delivering AI/ML features.
                      - paragraph [ref=e1274]: • Exposure to SOC 2 or ISO 27001 audits.
                      - paragraph [ref=e1275]: • Certifications (PMP, CSM, PMI-ACP) are welcome but won't substitute for a delivery and team-building track record. WHAT SUCCESS LOOKS LIKE IN YOUR FIRST 6 MONTHS
                      - paragraph [ref=e1276]: • 85%+ of implementations go live on the committed date.
                      - paragraph [ref=e1277]: • Billing milestones are invoiced on time, and receivables ageing is visibly down. • Every active account has baselined scope, a live RAID log and a change log.
                      - paragraph [ref=e1278]: • Services hiring is on plan, with near-zero regretted attrition.
                      - paragraph [ref=e1279]: • Leadership gets a monthly services MIS without having to chase it. WHO YOU'LL WORK WITH The services delivery team (engineers, Tech Leads, BAs, QA), product squads, DevOps, consulting teams, finance and client stakeholders.
