                      - paragraph [ref=e4460]
                      - paragraph [ref=e4461]:
                        - strong [ref=e4462]: What this role is
                      - paragraph [ref=e4463]: You are an engineer who leads projects at the scope of a service or major subsystem.
                      - paragraph [ref=e4464]: "That means: when a problem lands on your desk, it's usually ambiguous. Your job is to turn it into a clear problem statement, design a system to solve it, ship it through to production, and own how it behaves once it's there. You'll work with one or two engineers on most projects, and you'll be the technical person product, ops, and other engineering teams talk to about that domain."
                      - paragraph [ref=e4465]: You're not a senior individual contributor who only writes code for assigned tickets. You're not a tech lead who's stopped writing code. You're the person between those two — still hands-on, but increasingly the one shaping what gets built.
                      - paragraph [ref=e4466]
                      - paragraph [ref=e4467]:
                        - strong [ref=e4468]: What you'll do
                      - list [ref=e4469]:
                        - listitem [ref=e4470]:
                          - strong [ref=e4471]: Solve 2–4 complex problems a year
                          - text: "end-to-end: shape the problem, design the system, ship it, monitor it."
                        - listitem [ref=e4472]:
                          - strong [ref=e4473]: Design single-service systems independently.
                          - text: Define API contracts, data models, scale and reliability requirements. Document and review your design with peers before building.
                        - listitem [ref=e4474]:
                          - strong [ref=e4475]: Turn ambiguity into clarity.
                          - text: Take half-formed product tasks and partner with PMs to define what's actually being built. Push back when the ask doesn't make sense.
                        - listitem [ref=e4476]:
                          - strong [ref=e4477]: Stay hands-on.
                          - text: Write code that goes into production. Drive code reviews. Debug across service boundaries. Refactor when the codebase needs it.
                        - listitem [ref=e4478]:
                          - strong [ref=e4479]: Mentor 1–2 junior engineers.
                          - text: Be someone's first reviewer. Pair when it helps. Take their growth as your responsibility, not a side activity.
                        - listitem [ref=e4480]:
                          - strong [ref=e4481]: Be in hiring.
                          - text: Interview candidates regularly. Help shape the interview bar for your function.
                        - listitem [ref=e4482]:
                          - strong [ref=e4483]: Own outcomes, not output.
                          - text: Track the business or operational metric your work moves. If it doesn't move, that's a problem you own — not a problem you delivered to.
                      - paragraph [ref=e4484]
                      - paragraph [ref=e4485]:
                        - strong [ref=e4486]: What we're looking for
                      - list [ref=e4487]:
                        - listitem [ref=e4488]: Over 4 years of professional experience in software development, specifically focused on solving large-scale technical challenges.
                        - listitem [ref=e4489]: Expert-level proficiency in at least one major programming language (such as Java, GO, Rust, NodeJS etc) with a focus on writing scalable, maintainable, and unit-tested code.
                        - listitem [ref=e4490]: Strong command of object-oriented design, design patterns, and the creation of intuitive class-level interfaces.
                        - listitem [ref=e4491]: Hands-on experience with multi-threading, concurrency, and Test-Driven Development (TDD).
                        - listitem [ref=e4492]: Deep understanding of relational databases (Postgres) and various NoSQL technologies like HBase, Elasticsearch, or Aerospike, Cassandra
                        - listitem [ref=e4493]: Comprehensive knowledge of the full software development life cycle on Linux platforms.
                        - listitem [ref=e4494]: Proven ability to build highly scalable applications that manage complex business logic and massive datasets.
                        - listitem [ref=e4495]: A proactive, "go-getter" mindset characterized by high energy and dedication to task ownership.
                        - listitem [ref=e4496]: Experience thriving in fast-paced startup environments with a strong sense of commitment and accountability.
                        - listitem [ref=e4497]: A passionate drive to tackle complex, real-world problems through innovative engineering.
                        - listitem [ref=e4498]: You've made and defended technical decisions, picked up problems no one assigned, or built things people use that no one asked for.
                        - listitem [ref=e4499]: Strong fundamentals in your primary stack — concurrency, data modeling, debugging across systems, performance work. We're stack-agnostic for the right person.
                        - listitem [ref=e4500]: Experience designing systems with explicit attention to scale, reliability, and cost — not just functional correctness.
                        - listitem [ref=e4501]: Collaborate with a wide range of stakeholders to monitor project outcomes and iteratively refine features based on real-world impact.
