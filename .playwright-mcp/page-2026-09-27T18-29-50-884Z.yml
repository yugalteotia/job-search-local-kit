            - generic [ref=e637]: Job Description
            - paragraph [ref=e638]:
              - strong [ref=e639]: Summary
              - text: Apple is a place where extraordinary people gather to do their best work. Together we craft products and experiences people once couldn't have imagined — and now can't imagine living without.Do you want to help build some of the largest and most consequential enterprise and customer technology systems in the world Join Apple's Information Systems and Technology (IS&T) organization. IS&T is the engine behind everything Apple does for customers and for the people who build for them. It's Apple's central nervous system. Supporting 2.5 billion active Apple devices, processing billions of secure transactions, and keeping the technology that defines modern life running flawlessly, IS&T makes the impossible feel effortless.Customer Systems is part of IS&T and drives the technology behind Apple's customer support experience — from contact center operations to the software powering the iconic Genius Bar. The team also builds and operates AppleCare's online support platform, which handles 6 billion visits per year, delivering seamless, high-quality support to Apple customers around the globeDo you love building solutions to handle global complexity and immense scale Imagine what you could do here.
              - strong [ref=e640]: Description
              - text: We are looking for mid-career senior-level Java Software Engineers, highly motivated and dedicated to build the next generation of software services that powers several critically important applications. In this role you will be partnering with multi-functional teams across Apple. You will work closely with our business leaders and other partners to implement new solutions. The candidate must be able to work independently, understand the needs and build the solutions for sophisticated architecture and comfortable working under pressure at times.The ideal candidate is self-motivated, pro-active and results-driven. Attention to detail, dedication to providing high-quality solutions modeling engineering excellence, and ability to work towards on-time delivery of projects are all crucial qualities needed to work at Apple as a Software Engineer.The ideal candidate will also possess excellent communication and collaboration skills to work with various internal and external partners.
              - strong [ref=e641]: Responsibilities
              - list [ref=e642]:
                - listitem [ref=e643]: Design, develop, test, document, improve, and maintain highly reliable, scalable, and maintainable enterprise applications mostly in Java (and other languages as needed) that can match Apple volumes
                - listitem [ref=e644]: Understand requirements, engage with team members, multi-functional teams and project managers to define solutions, and estimate the scope of work required
                - listitem [ref=e645]: Collaborate with, mentor, and influence members within your team and across other teams at Apple
                - listitem [ref=e646]: Deliver solutions that can keep up with a rapidly evolving product in a timely fashion
                - listitem [ref=e647]: Review technical designs and perform code review
              - strong [ref=e648]: Minimum Qualifications
              - list [ref=e649]:
                - listitem [ref=e650]: Bachelor's degree in computer science or a related technical field or equivalent professional work experience
                - listitem [ref=e651]: 5+ years proven experience developing software in a professional capacity. Longer experience preferred.
                - listitem [ref=e652]: 3+ years proven experience implementing, and shipping high-scale, high-performance, highly available, fault-tolerant, and secure cloud-based distributed systems, including proficiency in REST API implementation
                - listitem [ref=e653]: 3+ years proven experience using relational (e.g. Postgres, MySQL, etc.) and NoSQL (e.g. Cassandra, MongoDB, etc.) databases, including proficiency in schema design and query optimization.
                - listitem [ref=e654]: 3+ years proven experience with Java, Spring, SpringBoot including proficiency in concurrency, memory management, and performance optimization techniques.
                - listitem [ref=e655]: Proficiency in OOP principles, data structures, algorithms, and software design patterns (e.g. GoF), with a proven focus on implementing testable, maintainable, and extensible backend code.
              - strong [ref=e656]: Preferred Qualifications
              - list [ref=e657]:
                - listitem [ref=e658]: Track record of leading software projects within a team as a tech lead (TL), while mentoring software engineers.
                - listitem [ref=e659]: Comfortable using CI/CD tools to build, test, deploy, and release containerized software applications on cloud-based Kubernetes (e.g. AWS EKS, GCP GKE, Azure AKS, etc.).
                - listitem [ref=e660]: Experience in reactive programming (Spring Webflux/ Project Reactor) and unit testing frameworks (e.g. JUnit, Mockito, etc.).
                - listitem [ref=e661]: Experience with tooling languages (e.g. Go, Python, Ruby, etc.) and distributed orchestration & computing systems (e.g. Airflow, Spark, Flink, etc.).
                - listitem [ref=e662]: Understanding of advanced JVM internals (e.g. garbage collection, memory allocation, JIT, JNI, etc.).
                - listitem [ref=e663]: Knowledge of networking concepts & protocols (e.g. HTTP/HTTPS, CDN, edge computing, load balancing, OSI model, etc.)
              - text: "At Apple, we believe accessibility is a fundamental human right. You'll find that idea reflected in everything here — in our culture, our benefits and our digital tools. By welcoming as many perspectives as possible, we help you build a career where you feel like you belong.Learn about accessibility in Apple's workplaceRole Number: 200677847-1052"
