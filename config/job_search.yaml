search:
  terms:
  - Java Spring Boot backend
  - Java Backend Developer
  - Java Spring Boot
  target_roles:
  - Backend Engineer
  - Java Developer
  - Software Engineer
  - API Engineer
  - Full Stack Engineer
  locations:
  - Pune
  - Bengaluru
  - Hyderabad
  - Delhi NCR
  - Mumbai
  - Chennai
  - Remote India
  experience_years:
    min: 1
    max: 4
  hard_exclusions:
  - paid placement
  - pure support or operations
  - manual testing as primary work
  - outside India without India-remote eligibility
high_fit:
  minimum_essential_coverage: 1.0
  maximum_required_professional_years: 2.5
  require_java_and_spring_boot: true
  require_substantial_backend: true
  require_india_location: true
  allow_project_training_evidence_with_depth_review: true
  secondary_skills_policy: interview_preparation
  maximum_approved_near_miss_years: 3
review:
  per_company_cap: 5
  max_jds_per_run: 30
  max_original_checks_per_company: 20
  max_portal_leads_per_run: 10
schedule:
  enabled: true
  application_enabled: true
  timezone: Asia/Kolkata
  times:
  - 08:30
  - '12:30'
  - '16:30'
  - '20:30'
  missed_run_catchup: false
  max_seconds: 1800
concurrency:
  discovery: 3
  verification: 3
  resume: 3
  application: 1
  per_employer: 1
  per_ats: 1
alerts:
  desktop_enabled: true
  phone_enabled: false
  repeat_cooldown_minutes: 360
retention:
  terminal_details_days: 0
  submission_proof_days: 30
  run_logs_days: 90
submissions:
  enabled: true
  require_live_form_test: true
  require_confirmation_proof: true
naukri_worker:
  enabled: true
  max_submissions_per_run: 10
  medium_max_required_years_exclusive: 4
  excluded_requisition_ids:
  - '250926037784'
  - 070926003879
  - '2388999'
  - '190826038395'
  - '280926023134'
  - '160926009207'
  require_role_resume_visual_review: true
  require_generic_resume_restore: true
direct_requisition_rules:
  lever:
    enabled: false
    hosts:
    - jobs.lever.co
    path_pattern: ^/[A-Za-z0-9_-]+/[0-9a-fA-F-]{36}/?$
  greenhouse:
    enabled: false
    hosts:
    - job-boards.greenhouse.io
    - boards.greenhouse.io
    path_pattern: ^/[A-Za-z0-9_-]+/jobs/[0-9]+/?$
  ashby:
    enabled: false
    hosts:
    - jobs.ashbyhq.com
    path_pattern: ^/[A-Za-z0-9_-]+/[0-9a-fA-F-]{36}/?$
  employer_site:
    enabled: false
    host_policy: linked_apply_url_exact_host
    apply_link_text_pattern: '(?i)^(apply(?: now| on company site)?|view (?:job|role)|company
      site)$'
    path_pattern: (?i)(?:/jobs?/|/careers?/|/positions?/|/roles?/|job[-_]?details?)
    max_links_per_lead: 3
