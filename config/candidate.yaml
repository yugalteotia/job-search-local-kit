  - id: work_from_office
    question: comfortable with.*(?:work from office|onsite|on site|hybrid|remote|wfo)|willing
      to work (?:from office|onsite|on site|hybrid|remotely)
    fact: 'Open to: any work mode'
    value: 'Yes'
  - id: current_residence_or_relocation
    question: (?:living|residing|based|located).*\bor\b.*(?:ready|willing|open).*relocat
    fact: 'Open to:.*any city in India; willing to relocate'
    value: 'Yes'
    confirmed_india_locations:
    - bengaluru
    - bangalore
    - pune
    - mumbai
    - hyderabad
    - chennai
    - kolkata
    - delhi
    - delhi ncr
    - gurugram
    - gurgaon
    - noida
    - india
  - id: relocation
    question: willing to relocate|open to relocation
    fact: willing to relocate
    value: 'Yes'
  - id: current_location
    question: current location|current city|where are you currently based|where are
      you located
    fact: 'Current location: Pune, India'
    value: Pune, India
  - id: notice_period
    question: notice period
    fact: 'Application notice-period answer: \*\*Immediate joiner\*\*'
    value: Immediate joiner
  - id: earliest_joining_date
    question: earliest joining date|when can you join
    fact: 'Earliest joining date: \*\*1 October 2026\*\*'
    value: 1 October 2026
  - id: backend_experience
    question: (?:backend|java).*experience|experience.*(?:backend|java)
    fact: 'Relevant professional Java/backend experience: \*\*approximately 2 years'
    value: Approximately 2 years
  - id: total_experience
    question: overall.*experience|total.*experience
    fact: 2\+ years overall
    value: 2+ years overall, approximately
  - id: work_authorization
    question: authorized to work|authorization to work
    fact: unrestricted authorization to work in India
    value: 'Yes'
  - id: sponsorship
    question: sponsorship
    fact: no sponsorship required for an India-based role
    value: 'No'
  - id: gender
    question: gender
    fact: 'Gender: Male'
    value: Male
  - id: virtual_interview_availability
    question: ^are you available for (?:a |an )?interview virtual$
    fact: 'Virtual interview screening availability: \*\*Yes\*\*'
    value: 'Yes'
  - id: last_annual_ctc
    question: (?:current|last|previous) (?:annual )?ctc|current compensation
    fact: Current\ CTC:\ ₹10\ LPA\ annual\ total\ CTC\ =\ ₹9\ LPA\ fixed\ \+\ ₹1\
      LPA\ performance\-based\ variable,\ confirmed\ by\ Yugal\.\ Never\ describe\
      ₹10\ LPA\ as\ fixed\ pay\.\ Match\ the\ observed\ form's\ exact\ salary\ label\.
    value: 10 LPA annual total CTC
  - id: genai_agent_experience
    question: ^how many years of experience do you have in genai or artificial intelligence$
    fact: GenAI agent workflow development \(user confirmed 2026-10-14\)
    value: '0.66'
    duration_start_month: 2026-01
    duration_end_date: '2026-09-30'
    scope: AI agents for RCA and code optimization at IDeaS; no model or integration-feature
      tenure claimed
